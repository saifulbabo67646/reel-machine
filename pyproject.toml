[project]
name = "reel-machine"
version = "0.1.0"
description = "Search Japanese dialogue with the Nadeshiko API, cut the matching scenes from your own streaming library with ffmpeg, and render subtitled vertical reels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "rich>=13.7",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.scripts]
reel = "reelmachine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reelmachine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: touches ffmpeg / real media files"]

[tool.uv]
# The package is installed into the venv in editable mode, so `uv run reel ...`
# always executes the working tree.
package = true
