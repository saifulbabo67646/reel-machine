[project]
name = "reel-machine"
version = "0.2.0"
description = "Search Japanese dialogue with the Nadeshiko API, cut the matching scenes from your own streaming library with ffmpeg, and render subtitled vertical reels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "Pillow>=10",
    "pydantic>=2.6",
    "rich>=13.7",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.scripts]
reel = "reelmachine.cli:main"

# Built-in providers register through exactly the same entry points as third-party
# packages; nothing in the core knows their names.
[project.entry-points."reelmachine.recipes"]
nadeshiko-cut = "reelmachine.recipes.nadeshiko_cut.recipe:NadeshikoCutRecipe"
quranic = "reelmachine.recipes.quranic.recipe:QuranicRecipe"
doodle = "reelmachine.recipes.doodle.recipe:DoodleRecipe"
storyreel = "reelmachine.recipes.storyreel.recipe:StoryReelRecipe"
wordreel = "reelmachine.recipes.wordreel.recipe:WordReelRecipe"
explainer3d = "reelmachine.recipes.explainer3d.recipe:Explainer3DRecipe"
mapreel = "reelmachine.recipes.mapreel.recipe:MapReelRecipe"

[project.entry-points."reelmachine.clips"]
library = "reelmachine.recipes.wordreel.library:LibraryClipSource"
wordreel-fake = "reelmachine.recipes.wordreel.fake:FakeClipSource"

[project.entry-points."reelmachine.sources"]
local = "reelmachine.sources.local:LocalLibraryProvider"
hls = "reelmachine.sources.hls:HlsProvider"
vidvault = "reelmachine.sources.vidvault:VidVaultProvider"
mock = "reelmachine.sources.mock:MockProvider"

[project.entry-points."reelmachine.corpora"]
nadeshiko = "reelmachine.corpora.nadeshiko:NadeshikoCorpus"
nadeshiko-fake = "reelmachine.recipes.nadeshiko_cut.fake:FakeNadeshikoCorpus"
quran_com = "reelmachine.recipes.quranic.corpora.quran_com:QuranComCorpus"
alquran_cloud = "reelmachine.recipes.quranic.corpora.alquran_cloud:AlQuranCloudCorpus"
quran-fake = "reelmachine.recipes.quranic.corpora.fake:FakeQuranCorpus"

[project.entry-points."reelmachine.storage"]
local = "reelmachine.storage.local:LocalStorage"
memory = "reelmachine.storage:InMemoryStorage"
s3 = "reelmachine.storage.s3:S3Storage"

[project.entry-points."reelmachine.renderers"]
stroke = "reelmachine.recipes.doodle.scenes.stroke:StrokeRenderer"
program = "reelmachine.recipes.doodle.scenes.program:ProgramRenderer"
hyperframes = "reelmachine.render.hyperframes:HyperframesRenderer"
explainer3d-fake = "reelmachine.recipes.explainer3d.fake:FakeShotRenderer"

[project.entry-points."reelmachine.narration"]
fake = "reelmachine.recipes.doodle.narration.fake:FakeNarration"
elevenlabs = "reelmachine.recipes.doodle.narration.cloud:ElevenLabsNarration"
cartesia = "reelmachine.recipes.doodle.narration.cloud:CartesiaNarration"
macos = "reelmachine.recipes.doodle.narration.macos:MacOSNarration"

[project.entry-points."reelmachine.scripts"]
template = "reelmachine.recipes.doodle.script:TemplateScriptProvider"
llm = "reelmachine.recipes.doodle.script:LlmScriptProvider"

[project.entry-points."reelmachine.subtitles"]
embedded = "reelmachine.recipes.storyreel.subtitles.embedded:EmbeddedSubtitleProvider"
subdl = "reelmachine.recipes.storyreel.subtitles.subdl:SubdlProvider"
opensubtitles = "reelmachine.recipes.storyreel.subtitles.opensubtitles:OpenSubtitlesProvider"
auto = "reelmachine.recipes.storyreel.subtitles.auto:AutoSubtitleProvider"
fake = "reelmachine.recipes.storyreel.subtitles.fake:FakeSubtitleProvider"

[project.entry-points."reelmachine.story"]
llm = "reelmachine.recipes.storyreel.story.llm:LlmStoryBrain"
fake = "reelmachine.recipes.storyreel.story.fake:FakeStoryBrain"

[project.entry-points."reelmachine.backgrounds"]
gradient = "reelmachine.recipes.quranic.backgrounds.gradient:GradientBackgroundProvider"
fake = "reelmachine.recipes.quranic.backgrounds.gradient:SolidBackgroundProvider"
pexels = "reelmachine.recipes.quranic.backgrounds.pexels:PexelsBackgroundProvider"

[project.entry-points."reelmachine.styles"]
bundled = "reelmachine.core.style:bundled_style_map"

# Pages and files behind Cloudflare Turnstile. `patchright` is preferred because it can
# click inside the widget's cross-origin frame; `agent-browser` fetches through a gate a
# session has already cleared and needs a Node binary rather than a Python package.
[project.entry-points."reelmachine.browser"]
patchright = "reelmachine.browser.patchright:PatchrightBrowser"
agent-browser = "reelmachine.browser.agent_browser:AgentBrowserBackend"
fake = "reelmachine.browser.fake:FakeBrowser"

[project.optional-dependencies]
# Every optional capability lives behind an extra; the default install is local-first
# and needs no browser, no Node and no GPU.
mcp = ["mcp>=2,<3"]
stroke = ["opencv-python-headless>=4.9", "Pillow>=10", "av>=12"]
program = ["Pillow>=10"]
s3 = ["boto3>=1.34"]
# The stealth browser itself is downloaded on first use: `patchright install chromium`.
browser = ["patchright>=1.63"]
# Bytes from hosts that gate on the TLS fingerprint (a clip's .mp4) — no browser needed.
impersonate = ["curl-cffi>=0.16"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mcp>=2,<3",
    "opencv-python-headless>=4.9",
    "Pillow>=10",
    "av>=12",
    "patchright>=1.63",
    "curl-cffi>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reelmachine*"]

[tool.setuptools.package-data]
reelmachine = [
    "data/*.json",
    "data/styles/*.json",
    "recipes/explainer3d/looks/*.json",
    "recipes/explainer3d/sets/*.json",
    "recipes/explainer3d/runtime/*.mjs",
    "recipes/explainer3d/runtime/tools/*.mjs",
    "recipes/explainer3d/runtime/vendor/*",
    "recipes/explainer3d/runtime/vendor/jsm/*/*.js",
    "recipes/mapreel/runtime/*.mjs",
    "vendor/srt-whiteboard-animation/LICENSE",
    "vendor/srt-whiteboard-animation/UPSTREAM.md",
    "vendor/srt-whiteboard-animation/assets/*",
    "vendor/srt-whiteboard-animation/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: touches ffmpeg / real media files"]

[tool.uv]
# The package is installed into the venv in editable mode, so `uv run reel ...`
# always executes the working tree.
package = true
